packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true
  prisma: true
  '@prisma/engines': true

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - '@expo/ui@58.0.20'
  - babel-preset-expo@58.0.17
  - expo-asset@58.0.16
  - expo-glass-effect@58.0.4
  - expo-image@58.0.15
  - expo-modules-core@58.0.21
  - expo-modules-jsi@58.0.14
  - expo-router@58.0.22
  - expo-splash-screen@58.0.10
  - expo-system-ui@58.0.6
  - expo@58.0.13
  - '@prisma/client@7.10.1'
  - prisma@7.10.1

nodeLinker: hoisted

overrides:
  typescript: 6.0.3
