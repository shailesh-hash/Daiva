services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daiva
      POSTGRES_PASSWORD: daiva
      POSTGRES_DB: daiva
    ports:
      - '5432:5432'
    volumes:
      - daiva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daiva -d daiva']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  daiva_pgdata:
