# Static Expo web preview. Catalogue fixtures are baked in so the site
# works without the Fastify API or Postgres. Do not add SPA catch-all
# redirects; Expo static export emits one HTML file per route.
[build]
  command = "pnpm --filter @daiva/client build"
  publish = "apps/client/dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_USE_CATALOGUE_FIXTURES = "true"

